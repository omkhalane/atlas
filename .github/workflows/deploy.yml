name: Deploy ATLAS Code Viewer

on:
  push:
    branches: ["code-viewer"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: atlas-code-viewer/package-lock.json

      - name: Install dependencies
        working-directory: ./atlas-code-viewer
        run: npm ci

      - name: Prepare Repository Snapshot
        working-directory: ./atlas-code-viewer
        run: npm run prepare-repo

      - name: Build
        working-directory: ./atlas-code-viewer
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './atlas-code-viewer/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
