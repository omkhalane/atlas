<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 3840" width="3840" height="3840">
  <!-- App Icon Background with Smooth Rounded Corners -->
  <rect width="3840" height="3840" rx="850" ry="850" fill="#ffffff"/>
  
  <!-- Thick & Bold Snowflake Logo -->
  <g stroke="#000000" stroke-width="320" stroke-linecap="round" stroke-linejoin="round">
    <defs>
      <g id="branch">
        <!-- Main Extended Vertical Stem -->
        <line x1="1920" y1="1920" x2="1920" y2="480" />
        <!-- Left Bold Side Prong -->
        <line x1="1920" y1="1100" x2="1500" y2="680" />
        <!-- Right Bold Side Prong -->
        <line x1="1920" y1="1100" x2="2340" y2="680" />
      </g>
    </defs>
    
    <!-- 6-Fold Rotational Symmetry -->
    <use href="#branch" />
    <use href="#branch" transform="rotate(60 1920 1920)" />
    <use href="#branch" transform="rotate(120 1920 1920)" />
    <use href="#branch" transform="rotate(180 1920 1920)" />
    <use href="#branch" transform="rotate(240 1920 1920)" />
    <use href="#branch" transform="rotate(300 1920 1920)" />
  </g>
</svg>
